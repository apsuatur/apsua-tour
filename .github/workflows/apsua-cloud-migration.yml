name: Apsua Cloudflare migration (manual only)

# One-time cloud restore: no customer data enters repository history or Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify staged backup or import into empty Cloudflare D1/R2"
        required: true
        type: choice
        options:
          - verify
          - restore
        default: verify
      confirmation:
        description: "For restore only: type RESTORE-APSUA-498-74"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apsua-cloudflare-migration
  cancel-in-progress: false

jobs:
  cloud-restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check manual confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          if [ "$MODE" = "restore" ] && [ "$CONFIRM" != "RESTORE-APSUA-498-74" ]; then
            echo "Restore not confirmed"; exit 1
          fi

      - name: Checkout source (no persistent Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        if: inputs.mode == 'restore'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned repository dependencies
        if: inputs.mode == 'restore'
        run: npm ci --ignore-scripts

      - name: Install S3 SDK for private staging
        run: python -m pip install --disable-pip-version-check boto3==1.40.70

      - name: Verify backup and optionally restore to own Cloudflare
        env:
          APSUA_MIGRATION_MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APSUA_D1_DATABASE_ID: ${{ secrets.APSUA_D1_DATABASE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.APSUA_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.APSUA_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: python scripts/cloud-migration/restore-from-r2.py

      - name: No backup artifacts retained
        if: always()
        run: |
          echo "The runner is ephemeral; no backup is uploaded to GitHub Artifacts."

name: Verify self-hosted Cloudflare build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  self-hosted-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build standalone Worker without deployment
        env:
          APSUA_SELF_HOSTED: '1'
          APSUA_WORKER_NAME: 'apsuatur-prod'
          APSUA_D1_DATABASE_ID: '11111111-2222-4333-8444-555555555555'
        run: |
          npm run build
          node scripts/check-self-hosted-build.mjs
